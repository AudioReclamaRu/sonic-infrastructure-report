name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: assemble the public surface
        run: |
          mkdir -p _site
          cp -r geo _site/
          for f in index.html privacy-policy.html terms-of-service.html data-deletion.html llms.txt llms-full.txt; do
            [ -f "$f" ] && cp "$f" _site/ || true
          done
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
