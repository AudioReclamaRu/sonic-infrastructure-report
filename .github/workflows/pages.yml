name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: build GEO surface
        run: python tools/build_geo_site.py
      - name: assemble the public surface
        run: |
          mkdir -p _site
          # geo/ — главный артефакт, собран предыдущим шагом; падаем, если его
          # нет: раньше `|| true` глотал сбой и мог задеплоить пустой сайт.
          cp -r geo _site/
          cp robots.txt _site/
          for f in index.html privacy-policy.html terms-of-service.html data-deletion.html llms.txt llms-full.txt; do
            [ -f "$f" ] && cp "$f" _site/ || true
          done
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
