name: repo-integrity

# The repository's own failure mode was documented, not hypothetical: the prose
# described a `win` field that never existed, a 4-field concept gate that was
# actually 9, and 152 .md files with no type at all. These checks make that
# class of drift fail loudly instead of misleading an agent.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the date fallback in add_frontmatter reads git log

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: compile the publication gate
        run: python -m py_compile publisher.py editorial_object.py

      - name: reports/INDEX.json is current
        run: python tools/make_reports_index.py --check

      - name: every hand-authored .md has frontmatter
        run: python tools/add_frontmatter.py --check

      - name: IVR Flow Linter regression tests
        run: python -m unittest discover -s tools/ivr_flow_linter/tests -v

      - name: IVR Flow Linter valid fixture
        run: python tools/ivr_flow_linter/ivr_flow_lint.py tools/ivr_flow_linter/examples/valid-flow.json

      - name: IVR Flow Linter rejects negative fixture
        shell: bash
        run: |
          if python tools/ivr_flow_linter/ivr_flow_lint.py tools/ivr_flow_linter/examples/invalid-flow.json; then
            echo "Expected the deliberately invalid fixture to fail."
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi

      - name: character-voice passport safeguards
        run: python tools/check_character_voice_passport.py

      - name: canonical brand and website naming
        run: python tools/check_brand_naming.py

      - name: AI Discovery asset integrity
        run: python tools/validate_ai_discovery_assets.py

      - name: AI service route registry
        run: python tools/ai_service_route_registry.py validate

      - name: AI service route registry regression tests
        run: python -m unittest tools.tests.test_ai_service_route_registry -v

      - name: AI service route evidence matrix
        run: python tools/ai_service_route_evidence.py validate

      - name: AI service route evidence regression tests
        run: python -m unittest tools.tests.test_ai_service_route_evidence -v

      - name: AI offer/service boundary registry
        run: python tools/ai_offer_service_boundaries.py validate

      - name: AI offer/service boundary regression tests
        run: python -m unittest tools.tests.test_ai_offer_service_boundaries -v

      - name: AI visibility benchmark and evidence regression tests
        run: python -m unittest tools.tests.test_ai_visibility_benchmark tools.tests.test_ai_visibility_evidence -v

      - name: Megabrain AI Discoverability contract
        run: python tools/ai_discoverability_contract.py validate

      - name: Megabrain AI Discoverability regression tests
        run: python -m unittest tools.tests.test_ai_discoverability_contract -v
